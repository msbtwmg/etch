<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css" /> 
    <link rel="reset" href="reset.css" /> 
    <title>Etch-a-Sketch</title>
</head>
<body>

    <div class="flex-container">
        <h1 id="title">Etch a Sketch</h1>
        <div class="content">
            <div class="board"></div>
            <div class="buttons">
                <button onclick = "changeColor('black')" onClick = "buttonColor()">Black</button>
                <button onclick = "changeColor('gray')">Gray</button>
                <button onclick = "changeColor('random')">Random</button>
                <button onclick = "changeColor('white')">Erasor</button>
                <button onclick = "resetBoard()">Reset</button>
            </div>
            <div>
                <input type="text" placeholder="Size Board" value="16" onchange="changeSize(this.value)"/>
                <button>Set Size</button>
            </div>
            <div class="error">
                Input must be between 2 and 100
            </div>
        </div>

    </div>
</body>   
<script src="etchScript.js"></script>
</html>
